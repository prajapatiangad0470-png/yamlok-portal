<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏛️ यमलोक - Yamraj Throne</title>
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit&family=Yatra+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --fire: #ff2200;
            --gold: #ffd700;
            --bg: #030001;
        }

        body {
            background-color: var(--bg);
            color: #f0e6d2;
            font-family: 'Tiro Devanagari Sanskrit', serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            text-align: center;
        }

        /* Floating Skull Canvas Background */
        #particleCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1; pointer-events: none;
        }

        /* SCREEN 1: ANCIENT NARAK DWAR */
        #gateScreen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 10;
            background: radial-gradient(circle, #2a0000 0%, #030001 90%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            transition: all 0.8s ease-in-out;
        }

        .ancient-gate {
            width: 280px;
            height: 340px;
            border: 8px double var(--gold);
            border-bottom: none;
            border-radius: 140px 140px 0 0;
            background: radial-gradient(circle, #4a0000 0%, #050000 100%);
            box-shadow: 0 0 50px var(--fire), inset 0 0 30px #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        .gate-skulls {
            font-size: 2rem;
            text-shadow: 0 0 20px var(--fire);
            margin-bottom: 10px;
        }

        .gate-title {
            font-family: 'Yatra One', cursive;
            font-size: 2.2rem;
            color: var(--gold);
            text-shadow: 0 0 20px var(--fire);
            margin: 0;
        }

        .enter-btn {
            background: linear-gradient(180deg, #cc0000 0%, #550000 100%);
            border: 2px solid var(--gold);
            color: #fff;
            padding: 16px 32px;
            font-family: 'Yatra One', cursive;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 30px var(--fire);
            animation: pulseBtn 1.5s infinite alternate;
        }

        @keyframes pulseBtn {
            0% { transform: scale(0.95); box-shadow: 0 0 15px var(--fire); }
            100% { transform: scale(1.05); box-shadow: 0 0 40px var(--fire), 0 0 60px var(--gold); }
        }

        /* SCREEN 2: MAIN THRONE ROOM WITH SKULLS AND BONES */
        .main-container {
            position: relative;
            z-index: 2;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px 15px;
            display: none;
        }

        .throne-stage {
            position: relative;
            padding: 40px 20px;
            background: radial-gradient(circle, #330000 0%, #050001 85%);
            border: 3px double var(--gold);
            border-radius: 16px;
            box-shadow: 0 0 50px rgba(255, 34, 0, 0.9);
        }

        .throne-icon {
            font-size: 6rem;
            text-shadow: 0 0 40px #ff0000;
            margin: 20px 0;
            animation: throneGlow 2s infinite alternate;
        }

        @keyframes throneGlow {
            0% { transform: scale(0.98); filter: drop-shadow(0 0 15px #ff0000); }
            100% { transform: scale(1.05); filter: drop-shadow(0 0 35px #ff5500); }
        }

        .skull-bone-floor {
            font-size: 1.6rem;
            letter-spacing: 8px;
            color: #ccc;
            margin: 15px 0;
            text-shadow: 0 0 12px var(--fire);
        }

        .title {
            font-family: 'Yatra One', cursive;
            font-size: 2.8rem;
            color: var(--gold);
            text-shadow: 0 0 25px var(--fire);
            margin: 10px 0;
        }

        .sub-text {
            color: #ffaaaa;
            font-size: 1.1rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <!-- 1. ANCIENT NARAK DWAR SCREEN -->
    <div id="gateScreen">
        <div class="ancient-gate">
            <div class="gate-skulls">💀 ☠️ 💀</div>
            <h1 class="gate-title">प्राचीन<br>नरक द्वार</h1>
            <div class="gate-skulls" style="margin-top:15px;">🔥 🦬 🔥</div>
        </div>
        <button class="enter-btn" onclick="enterYamlok()">🔥 TAP TO ENTER YAMLOK 🔥</button>
    </div>

    <!-- 2. MAIN THRONE & SKULLS/BONES ONLY -->
    <div class="main-container" id="mainRoom">
        <div class="throne-stage">
            <div class="skull-bone-floor">💀 ☠️ 🦴 💀 ☠️ 🦴 💀</div>
            <div class="skull-bone-floor">🦴 💀 ☠️ 🦴 ☠️ 💀 🦴</div>
            
            <div class="throne-icon">🦬</div>
            <h1 class="title">यमराज महा-सिंहासन</h1>
            <p class="sub-text">"धर्मराज यमराज का मुख्य सिंहासन कक्ष"</p>

            <div class="skull-bone-floor">🦴 💀 ☠️ 🦴 ☠️ 💀 🦴</div>
            <div class="skull-bone-floor">💀 ☠️ 🦴 💀 ☠️ 🦴 💀</div>
        </div>
    </div>

    <script>
        function enterYamlok() {
            const gate = document.getElementById('gateScreen');
            gate.style.opacity = '0';
            gate.style.transform = 'scale(1.2)';
            setTimeout(() => {
                gate.style.display = 'none';
                document.getElementById('mainRoom').style.display = 'block';
            }, 700);
        }

        // Floating Skulls & Bones Background Animation
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        const items = ['💀', '☠️', '🦴'];
        const particles = Array.from({length:50}, () => ({
            x: Math.random()*canvas.width, y: Math.random()*canvas.height,
            sy: Math.random()*-1-0.3, size: Math.random()*18+10,
            icon: items[Math.floor(Math.random()*items.length)]
        }));

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.y += p.sy; if(p.y < -20) p.y = canvas.height + 20;
                ctx.font = `${p.size}px serif`;
                ctx.fillText(p.icon, p.x, p.y);
            });
            requestAnimationFrame(drawParticles);
        }
        drawParticles();
    </script>
</body>
</html>
